<form class="page" [formGroup]="form" (ngSubmit)="save()">
  <!-- Header -->
  <div class="page-header">
    <h1 class="title">{{ isEdit() ? '編輯角色' : '新增角色' }}</h1>
    <div class="actions">
      <button type="button" pButton class="p-button-outlined" icon="pi pi-times" label="取消" (click)="cancel()"></button>
      <button type="submit" pButton class="p-button-success" icon="pi pi-check" label="儲存" [disabled]="saving()"></button>
    </div>
  </div>

  <!-- Role data -->
  <div class="card">
    <h2 class="card-title">角色資料</h2>

    <div class="field">
      <label for="roleId">角色代碼 <span class="req">*</span></label>
      <input id="roleId" type="text" pInputText formControlName="roleId" placeholder="請輸入角色代碼" />
      @if (invalid('roleId')) {
        <small class="error">角色代碼為必填。</small>
      }
    </div>

    <div class="field">
      <label for="roleName">角色名稱 <span class="req">*</span></label>
      <input id="roleName" type="text" pInputText formControlName="roleName" />
      @if (invalid('roleName')) {
        <small class="error">角色名稱為必填。</small>
      }
    </div>

    <div class="field">
      <label for="permissionLevel">權限等級 <span class="req">*</span></label>
      <p-inputNumber
        inputId="permissionLevel"
        formControlName="permissionLevel"
        [useGrouping]="false"
        [min]="0"
      />
      @if (invalid('permissionLevel')) {
        <small class="error">權限等級為必填。</small>
      }
    </div>

    <div class="field">
      <label for="description">描述</label>
      <input id="description" type="text" pInputText formControlName="description" />
    </div>
  </div>

  <!-- Users (n-n) -->
  <div class="card">
    <h2 class="card-title">使用者</h2>
    <p-multiSelect
      [options]="users()"
      formControlName="userIds"
      optionLabel="label"
      optionValue="userId"
      placeholder="選擇使用者（可複選）"
      display="chip"
      [filter]="true"
      filterBy="label"
      [maxSelectedLabels]="9999"
      appendTo="body"
      styleClass="w-full"
    />
  </div>
</form>
