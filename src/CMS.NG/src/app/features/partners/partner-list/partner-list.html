<div class="page">
  <!-- Header -->
  <div class="page-header">
    <div class="title-block">
      <h1 class="title">合作廠商 Partner</h1>
      <span class="subtitle">課程合作廠商</span>
    </div>
    <div class="actions">
      <button
        type="button"
        pButton
        class="p-button-outlined"
        icon="pi pi-filter"
        label="搜尋條件"
        (click)="drawerVisible.set(true)"
      ></button>
      <button
        type="button"
        pButton
        class="p-button-success"
        icon="pi pi-plus"
        label="新增"
        (click)="add()"
      ></button>
    </div>
  </div>

  <!-- Table card -->
  <div class="card">
    <p-table
      [value]="partners()"
      [loading]="loading()"
      [paginator]="true"
      [rows]="pageState.rows"
      [first]="pageState.first"
      [rowsPerPageOptions]="rowsPerPageOptions"
      [sortField]="sortState.sortField ?? undefined"
      [sortOrder]="sortState.sortOrder"
      [showCurrentPageReport]="true"
      currentPageReportTemplate="{first}–{last} 筆，共 {totalRecords} 筆"
      dataKey="pkid"
      (onSort)="onSort($event)"
      (onPage)="onPage($event)"
      styleClass="p-datatable-sm p-datatable-gridlines"
    >
      <ng-template pTemplate="header">
        <tr>
          <th pSortableColumn="pkid" style="width: 6rem">主代碼 <p-sortIcon field="pkid" /></th>
          <th pSortableColumn="name">廠商名稱 <p-sortIcon field="name" /></th>
          <th pSortableColumn="appKey" style="width: 9rem">應用代碼 <p-sortIcon field="appKey" /></th>
          <th pSortableColumn="nameOnPartnerMenu">選單顯示名稱 <p-sortIcon field="nameOnPartnerMenu" /></th>
          <th pSortableColumn="nameOnCourseDetailPage">
            課程頁顯示名稱 <p-sortIcon field="nameOnCourseDetailPage" />
          </th>
          <th pSortableColumn="displayOrder" style="width: 8rem">
            顯示順序 <p-sortIcon field="displayOrder" />
          </th>
          <th style="width: 9rem" class="text-center">操作</th>
        </tr>
      </ng-template>

      <ng-template pTemplate="body" let-partner>
        <tr>
          <td>{{ partner.pkid }}</td>
          <td>
            <a class="link" [routerLink]="['/partners', partner.pkid]">{{ partner.name }}</a>
          </td>
          <td>{{ partner.appKey }}</td>
          <td>{{ partner.nameOnPartnerMenu }}</td>
          <td>{{ partner.nameOnCourseDetailPage }}</td>
          <td>{{ partner.displayOrder }}</td>
          <td class="text-center">
            <button
              type="button"
              pButton
              class="p-button-text p-button-rounded"
              icon="pi pi-eye"
              pTooltip="檢視"
              (click)="view(partner)"
            ></button>
            <button
              type="button"
              pButton
              class="p-button-text p-button-rounded"
              icon="pi pi-pencil"
              pTooltip="編輯"
              (click)="edit(partner)"
            ></button>
            <button
              type="button"
              pButton
              class="p-button-text p-button-rounded p-button-danger"
              icon="pi pi-trash"
              pTooltip="刪除"
              (click)="confirmDelete(partner)"
            ></button>
          </td>
        </tr>
      </ng-template>

      <ng-template pTemplate="emptymessage">
        <tr>
          <td colspan="7" class="text-center text-muted">查無資料</td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</div>

<!-- Filter drawer -->
<p-drawer [(visible)]="drawerVisibleModel" header="搜尋條件" position="right" styleClass="filter-drawer">
  <div class="filter-body">
    <div class="field">
      <label for="f-keyword">關鍵字</label>
      <input
        id="f-keyword"
        type="text"
        pInputText
        [(ngModel)]="filters.keyword"
        placeholder="廠商名稱／應用代碼／顯示名稱"
      />
    </div>
  </div>

  <div class="filter-footer">
    <button type="button" pButton class="p-button-outlined" label="重設" (click)="resetFilters()"></button>
    <button type="button" pButton label="套用" icon="pi pi-search" (click)="applyFilters()"></button>
  </div>
</p-drawer>
