<div class="qr">
  @if (dataUrl(); as src) {
    <img class="qr-img" [src]="src" [attr.alt]="'QR code — ' + courseId" />
  } @else {
    <div class="qr-placeholder"><i class="pi pi-qrcode"></i></div>
  }
  <div class="qr-title" title="簡介代碼">{{ courseId }}</div>
  <button
    type="button"
    pButton
    class="p-button-outlined p-button-sm"
    icon="pi pi-download"
    label="下載 QR Code"
    [disabled]="!dataUrl()"
    (click)="download()"
  ></button>
</div>
