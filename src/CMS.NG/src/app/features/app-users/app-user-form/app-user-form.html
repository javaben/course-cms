<form class="page" [formGroup]="form" (ngSubmit)="save()">
  <!-- Header -->
  <div class="page-header">
    <h1 class="title">{{ isEdit() ? '編輯使用者' : '新增使用者' }}</h1>
    <div class="actions">
      <button type="button" pButton class="p-button-outlined" icon="pi pi-times" label="取消" (click)="cancel()"></button>
      <button type="submit" pButton class="p-button-success" icon="pi pi-check" label="儲存" [disabled]="saving()"></button>
    </div>
  </div>

  <!-- User data -->
  <div class="card">
    <h2 class="card-title">使用者資料</h2>

    <div class="field">
      <label for="userId">使用者代碼 <span class="req">*</span></label>
      <input id="userId" type="text" pInputText formControlName="userId" placeholder="請輸入使用者代碼" />
      @if (invalid('userId')) {
        <small class="error">使用者代碼為必填。</small>
      }
    </div>

    <div class="field">
      <label for="userName">使用者名稱 <span class="req">*</span></label>
      <input id="userName" type="text" pInputText formControlName="userName" />
      @if (invalid('userName')) {
        <small class="error">使用者名稱為必填。</small>
      }
    </div>

    <div class="field field-inline">
      <p-checkbox inputId="isActive" formControlName="isActive" [binary]="true" />
      <label for="isActive">啟用</label>
    </div>

    @if (isEdit()) {
      <div class="field">
        <label>密碼</label>
        <div class="password-row">
          <span class="text-muted">
            密碼更新時間：{{ passwordUpdatedTime() ? (passwordUpdatedTime()! + 'Z' | date: 'yyyy-MM-dd HH:mm') : '—' }}
          </span>
          @if (isAdmin()) {
            <button
              type="button"
              pButton
              class="p-button-warning p-button-sm"
              icon="pi pi-key"
              label="重設為預設密碼"
              (click)="confirmResetPassword()"
            ></button>
          }
        </div>
        <small class="text-muted">新增使用者時，系統會自動指定預設密碼。</small>
      </div>
    }
  </div>

  <!-- Roles (n-n) -->
  <div class="card">
    <h2 class="card-title">角色</h2>
    <p-multiSelect
      [options]="roles()"
      formControlName="roleIds"
      optionLabel="label"
      optionValue="roleId"
      placeholder="選擇角色（可複選）"
      display="chip"
      [filter]="true"
      filterBy="label"
      [maxSelectedLabels]="9999"
      appendTo="body"
      styleClass="w-full"
    />
  </div>
</form>
