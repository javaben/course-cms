<div class="page">
  <!-- Header -->
  <div class="page-header">
    <div class="title-block">
      <h1 class="title">異動紀錄 RowAudit</h1>
      <span class="subtitle">所有資料表的新增／修改／刪除軌跡（最新 500 筆）</span>
    </div>
    <div class="actions">
      <button
        type="button"
        pButton
        class="p-button-outlined"
        icon="pi pi-filter"
        label="搜尋條件"
        (click)="drawerVisible.set(true)"
      ></button>
      <button
        type="button"
        pButton
        class="p-button-outlined"
        icon="pi pi-refresh"
        label="重新整理"
        (click)="refresh()"
      ></button>
    </div>
  </div>

  <!-- Table card -->
  <div class="card">
    <p-table
      [value]="items()"
      [loading]="loading()"
      [paginator]="true"
      [rows]="pageState.rows"
      [first]="pageState.first"
      [rowsPerPageOptions]="rowsPerPageOptions"
      [sortField]="sortState.sortField ?? undefined"
      [sortOrder]="sortState.sortOrder"
      [showCurrentPageReport]="true"
      currentPageReportTemplate="{first}–{last} 筆，共 {totalRecords} 筆"
      dataKey="pkid"
      (onSort)="onSort($event)"
      (onPage)="onPage($event)"
      styleClass="p-datatable-sm p-datatable-gridlines"
    >
      <ng-template pTemplate="header">
        <tr>
          <th pSortableColumn="dateTime" style="width: 12rem">
            時間 DateTime <p-sortIcon field="dateTime" />
          </th>
          <th pSortableColumn="tableName" style="width: 12rem">
            資料表 Table <p-sortIcon field="tableName" />
          </th>
          <th pSortableColumn="primaryKeyValues" style="width: 8rem">主鍵 pkid</th>
          <th pSortableColumn="actionType" style="width: 8rem">
            動作 Action <p-sortIcon field="actionType" />
          </th>
          <th pSortableColumn="userName" style="width: 10rem">
            使用者 User <p-sortIcon field="userName" />
          </th>
          <th>說明 Description</th>
        </tr>
      </ng-template>

      <ng-template pTemplate="body" let-row>
        <tr>
          <td class="nowrap">{{ row.dateTime | date: 'yyyy-MM-dd HH:mm:ss' }}</td>
          <td>{{ row.tableName }}</td>
          <td>{{ row.primaryKeyValues }}</td>
          <td>
            <p-tag [value]="row.actionType" [severity]="actionSeverity(row.actionType)" />
          </td>
          <td>{{ row.userName }}</td>
          <td>{{ row.actionDesc || '—' }}</td>
        </tr>
      </ng-template>

      <ng-template pTemplate="emptymessage">
        <tr>
          <td colspan="6" class="text-center text-muted">尚無異動紀錄 No history yet</td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</div>

<!-- Filter drawer -->
<p-drawer [(visible)]="drawerVisibleModel" header="搜尋條件" position="right" styleClass="filter-drawer">
  <div class="filter-body">
    <div class="field">
      <label for="f-table">資料表</label>
      <p-select
        inputId="f-table"
        [(ngModel)]="filters.tableName"
        [options]="tableNames()"
        placeholder="不限"
        [showClear]="true"
        appendTo="body"
      />
    </div>
    <div class="field">
      <label for="f-action">動作</label>
      <p-select
        inputId="f-action"
        [(ngModel)]="filters.actionType"
        [options]="actionOptions"
        optionLabel="label"
        optionValue="value"
        placeholder="不限"
        [showClear]="true"
        appendTo="body"
      />
    </div>
    <div class="field">
      <label for="f-keyword">關鍵字</label>
      <input
        id="f-keyword"
        type="text"
        pInputText
        [(ngModel)]="filters.keyword"
        placeholder="使用者／主鍵／說明"
      />
    </div>
  </div>

  <div class="filter-footer">
    <button type="button" pButton class="p-button-outlined" label="重設" (click)="resetFilters()"></button>
    <button type="button" pButton label="套用" icon="pi pi-search" (click)="applyFilters()"></button>
  </div>
</p-drawer>
