<div class="page">
  <!-- Header -->
  <div class="page-header">
    <h1 class="title">檢視發布狀態</h1>
    <div class="actions">
      <app-row-audit-badge [tableName]="'PublishStatus'" [pkid]="status()?.pkid ?? null"></app-row-audit-badge>
      <button type="button" pButton class="p-button-outlined" icon="pi pi-arrow-left" label="返回" (click)="back()"></button>
      <button type="button" pButton class="p-button-success" icon="pi pi-pencil" label="編輯" (click)="edit()"></button>
    </div>
  </div>

  @if (status(); as s) {
    <div class="card">
      <h2 class="card-title">狀態資料</h2>
      <div class="detail-grid">
        <div class="detail-item">
          <span class="detail-label">主代碼</span>
          <span class="detail-value">{{ s.pkid }}</span>
        </div>
        <div class="detail-item">
          <span class="detail-label">狀態說明</span>
          <span class="detail-value">{{ s.description }}</span>
        </div>
        <div class="detail-item">
          <span class="detail-label">草稿</span>
          <span class="detail-value">
            <p-tag [value]="s.isDraft ? '是' : '否'" [severity]="s.isDraft ? 'success' : 'secondary'" />
          </span>
        </div>
        <div class="detail-item">
          <span class="detail-label">已發布</span>
          <span class="detail-value">
            <p-tag [value]="s.isPublished ? '是' : '否'" [severity]="s.isPublished ? 'success' : 'secondary'" />
          </span>
        </div>
        <div class="detail-item">
          <span class="detail-label">已停用</span>
          <span class="detail-value">
            <p-tag [value]="s.isDiscontinued ? '是' : '否'" [severity]="s.isDiscontinued ? 'danger' : 'secondary'" />
          </span>
        </div>
      </div>
    </div>
  } @else if (!loading()) {
    <div class="card">
      <span class="text-muted">查無此發布狀態。</span>
    </div>
  }
</div>
