<div class="page">
  <!-- Header -->
  <div class="page-header">
    <h1 class="title">檢視課程群組</h1>
    <div class="actions">
      <app-row-audit-badge [tableName]="'CourseGroup'" [pkid]="group()?.pkid ?? null"></app-row-audit-badge>
      <button type="button" pButton class="p-button-outlined" icon="pi pi-arrow-left" label="返回" (click)="back()"></button>
      <button type="button" pButton class="p-button-success" icon="pi pi-pencil" label="編輯" (click)="edit()"></button>
    </div>
  </div>

  @if (group(); as g) {
    <div class="card">
      <h2 class="card-title">群組資料</h2>
      <div class="detail-grid">
        <div class="detail-item">
          <span class="detail-label">主代碼</span>
          <span class="detail-value">{{ g.pkid }}</span>
        </div>
        <div class="detail-item">
          <span class="detail-label">群組說明</span>
          <span class="detail-value">{{ g.description }}</span>
        </div>
      </div>
    </div>
  } @else if (!loading()) {
    <div class="card">
      <span class="text-muted">查無此課程群組。</span>
    </div>
  }
</div>
